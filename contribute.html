<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribute - BilimQor-Core</title>
    <!-- Правильный относительный путь для GitHub Pages -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header id="main-header">
        <h1>BilimQor-Core</h1>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="architecture.html">Architecture</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="article-view.html">Article View</a></li>
                <li><a href="contributors.html">Contributors</a></li>
                <li><a href="contribute.html">Contribute</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Become a Contributor</h2>
        <form id="contact-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <label for="topic">Topic Category:</label>
            <select id="topic" name="topic">
                <option value="frontend">Front-End</option>
                <option value="backend">Back-End</option>
            </select>
            <label for="message">Description:</label>
            <textarea id="message" name="message" rows="5"></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

    <footer>
        <p>BilimQor-Core Team: Tagay Talgar, [Name 2], [Name 3]</p>
    </footer>

</body>
</html>
